name: Repository checks

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  # Deliberate manual, scheduled and tag runs each retain their own queue slot.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --locked --group dev
      - run: uv run pre-commit run --all-files --hook-stage manual

  validation:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run python -m compileall -q src
      - name: Run tests
        run: >-
          uv run pytest -n 4 --dist worksteal --tb=short --durations=10
          --junitxml="${{ runner.temp }}/eidolon-results.xml"
        env:
          EIDOLON_HOME: ${{ runner.temp }}/eidolon-ci
      - run: uv build
      - name: Summarize tests
        if: always()
        run: python3 scripts/summarize_tests.py "${{ runner.temp }}/eidolon-results.xml" >> "$GITHUB_STEP_SUMMARY"
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eidolon-results.xml
          if-no-files-found: ignore
          retention-days: 7

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --locked --group dev
      - run: uv run pip-audit --local --skip-editable
