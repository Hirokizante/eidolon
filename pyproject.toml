[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eidolon-room"
version = "0.1.0"
description = "A configurable macOS terminal companion for conversations, memories, and skills."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "textual>=1.0,<8", "httpx>=0.28,<1", "pydantic>=2.10,<3",
  "mcp>=1.20,<2", "croniter>=6,<7", "keyring>=25,<26",
  "beautifulsoup4>=4.13,<5", "PyYAML>=6,<7",
  "jsonschema>=4.23,<5", "tiktoken>=0.12,<1",
]

[project.scripts]
eidolon = "eidolon.cli:main"

[project.urls]
Repository = "https://github.com/Hirokizante/eidolon"
Issues = "https://github.com/Hirokizante/eidolon/issues"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.26,<2",
    "ruff>=0.12,<1",
    "pre-commit>=4,<5",
    "pytest-xdist>=3.8,<4",
    "pip-audit>=2.10.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eidolon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
